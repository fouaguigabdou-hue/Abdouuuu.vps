<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABDOUUU TEAM VPS</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:Arial,sans-serif}header{height:72px;border-bottom:1px solid #242424;display:flex;align-items:center;justify-content:space-between;padding:0 28px}h1{font-size:25px;letter-spacing:1px}.wrap{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 72px)}aside{border-left:1px solid #222;padding:20px}.nav{padding:14px;border-radius:10px;margin-bottom:8px;background:#0c0c0c}.main{padding:22px;display:grid;grid-template-columns:1fr 330px;gap:18px}.cards{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{border:1px solid #292929;border-radius:12px;background:#0a0a0a;padding:18px}.num{font-size:27px;font-weight:bold;margin-top:10px}.ok{color:#42e47b}.bad{color:#ff5c5c}.terminal{height:480px;background:#020202;border:1px solid #292929;border-radius:12px;overflow:auto}.termhead{padding:13px;border-bottom:1px solid #222}.logs{padding:18px;font:13px/1.7 monospace;direction:ltr;text-align:left;white-space:pre-wrap}.row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #1e1e1e}.btn{border:1px solid #444;background:#111;color:#fff;padding:7px 11px;border-radius:7px;cursor:pointer;margin-left:5px}.btn:hover{background:#1d1d1d}.upload{margin-top:15px}input,select{background:#111;color:#fff;border:1px solid #333;padding:9px;border-radius:7px;margin:4px} @media(max-width:900px){.wrap{grid-template-columns:1fr}aside{display:none}.main{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}
</style></head><body><header><h1>♛ ABDOUUU TEAM VPS</h1><span>WEBSITE & BOT HOSTING</span></header><div class="wrap"><aside><div class="nav">⌂ الرئيسية</div><div class="nav">◉ المواقع</div><div class="nav">◉ البوتات</div><div class="nav">▣ الملفات</div><div class="nav">⚙ الإعدادات</div></aside><main class="main"><section class="cards"><div class="card">المواقع النشطة<div id="sites" class="num">0</div></div><div class="card">البوتات العاملة<div id="bots" class="num">0</div></div><div class="card">حالة النظام<div class="num ok">ONLINE</div></div><div class="card">Terminal<div class="num">LIVE</div></div></section><section><div class="panel"><h2>Terminal — ABDOUUU TEAM VPS</h2><div id="terminal" class="terminal"><div class="termhead">systemctl status all</div><div id="logs" class="logs">Loading...</div></div></div><div class="panel upload"><h3>رفع مشروع</h3><input id="name" placeholder="اسم المشروع"><select id="kind"><option value="bot">Bot</option><option value="site">Website</option></select><input id="file" type="file"><button class="btn" onclick="upload()">رفع</button></div></section><section><div class="panel"><h2>المشاريع</h2><div id="projects">Loading...</div></div></section></main></div><script>let token=localStorage.getItem('token')||prompt('Panel token:');localStorage.setItem('token',token);const H={'X-Panel-Token':token};async function api(u,o={}){o.headers={...(o.headers||{}),...H};let r=await fetch(u,o);if(!r.ok)throw Error(await r.text());return r.json()}async function refresh(){try{let p=await api('/api/projects');let sites=p.filter(x=>x.type==='site').length,bots=p.filter(x=>x.type==='bot'&&x.status==='running').length;document.querySelector('#sites').textContent=sites;document.querySelector('#bots').textContent=bots;document.querySelector('#projects').innerHTML=p.map(x=>`<div class="row"><span>${x.name} — ${x.type} <b class="${x.status==='running'?'ok':'bad'}">${x.status}</b></span><span>${x.type==='bot'?`<button class="btn" onclick="act('${x.id}','start')">تشغيل</button><button class="btn" onclick="act('${x.id}','stop')">إيقاف</button><button class="btn" onclick="showLogs('${x.id}')">Logs</button>`:`<a class="btn" href="/site/${x.id}/" target="_blank">فتح</a>`}</span></div>`).join('');document.querySelector('#logs').textContent=p.map(x=>`[${x.status.toUpperCase()}] ${x.name} (${x.type})`).join('\n')}catch(e){document.querySelector('#logs').textContent=e.message}}async function act(id,a){await api(`/api/bots/${id}/${a}`,{method:'POST'});refresh()}async function showLogs(id){let r=await api(`/api/bots/${id}/logs`);document.querySelector('#logs').textContent=r.logs||'(no logs)'}async function upload(){let f=document.querySelector('#file').files[0];if(!f)return alert('اختر ملفًا');let d=new FormData();d.append('name',document.querySelector('#name').value);d.append('kind',document.querySelector('#kind').value);d.append('file',f);let r=await fetch('/api/upload',{method:'POST',headers:H,body:d});if(!r.ok)return alert(await r.text());refresh()}refresh();setInterval(refresh,5000)</script></body></html>
